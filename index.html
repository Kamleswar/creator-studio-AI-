<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Studio AI</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>🤖 Creator Studio AI</h1>
    <p>Create viral captions instantly.</p>

    <textarea
      id="prompt"
      placeholder="Type your post topic here..."
      rows="6"></textarea>

    <button onclick="generateCaption()">
      ✨ Generate Caption
    </button>

    <div id="result"></div>

    <button onclick="copyCaption()">
      📋 Copy Caption
    </button>

  </div>

  <script src="script.js"></script>

</body>
</html>
