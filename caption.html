<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Caption - Creator Studio AI</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}
.container{
max-width:600px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}
textarea{
width:100%;
height:120px;
padding:10px;
font-size:16px;
border-radius:8px;
margin-bottom:15px;
}
button{
width:100%;
padding:12px;
background:#007bff;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}
#result{
margin-top:20px;
white-space:pre-wrap;
background:#eee;
padding:15px;
border-radius:8px;
}
</style>
</head>

<body>

<div class="container">
<h2>🤖 AI Caption Generator</h2>

<textarea id="topic" placeholder="Apna topic likho..."></textarea>

<button onclick="generateCaption()">Generate Caption</button>

<div id="result"></div>
</div>

<script>
async function generateCaption(){

const topic=document.getElementById("topic").value;

document.getElementById("result").innerHTML="⏳ Caption generate ho raha hai...";

const response=await fetch("/api/caption",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({topic})
});

const data=await response.json();

document.getElementById("result").innerHTML=data.caption;

}
</script>

</body>
</html>
