<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Caption - Creator Studio AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🤖 AI Caption Generator</h1>
  <p>Generate viral captions using AI</p>

  <textarea
    id="prompt"
    placeholder="Example: Instagram post about Assam tea"
    rows="6"></textarea>

  <button onclick="generateCaption()">
    ✨ Generate Caption
  </button>

  <div id="result"></div>

  <button onclick="copyCaption()">
    📋 Copy Caption
  </button>

  <br><br>

  <button onclick="window.location.href='index.html'">
    ⬅ Back to Home
  </button>
</div>

<script src="script.js"></script>

</body>
</html>
